    <!-- MAIN CONTENT: CONTACT -->
    <main>
        <section class="section-box">
            <h2>Contact Me</h2>
            <!-- Hyperlink mailto requirement -->
            <p>Email me directly at: <a href="mailto:ayungamukras@gmail.com">ayungamukras@gmail.com</a></p>
            
            <!-- Contact form requirement -->
            <form action="#" method="POST">
                <div>
                    <label for="username">Your Name:</label><br>
                    <input type="text" id="username" name="username" placeholder="Mukras Ayunga" required>
                </div>
                <br>
                <div>
                    <label for="useremail">Your Email:</label><br>
                    <input type="email" id="useremail" name="useremail" placeholder="ayungamukras@gmail" required>
                </div>
                <br>
                <div>
                    <label for="usermessage">Message:</label><br>
                    <textarea id="usermessage" name="usermessage" rows="4" placeholder="Type your message" required></textarea>
                </div>
                <br>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
